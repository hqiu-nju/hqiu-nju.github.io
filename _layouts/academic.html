<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% unless page.active_nav == 'home' %}{{ page.title | escape }} · {% endunless %}Hao (Harry) Qiu · Radio astronomer</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="theme-color" content="#f7f8f4">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{% unless page.active_nav == 'home' %}{{ page.title | escape }} · {% endunless %}Hao (Harry) Qiu · Radio astronomer">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/images/profile.jpg' | absolute_url }}">
  <meta name="twitter:card" content="summary">
  <link rel="icon" type="image/svg+xml" href="{{ '/images/hq-mark.svg' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/academic.css' | relative_url }}">
  <script src="{{ '/assets/js/academic.js' | relative_url }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header content-wrap">
    <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="Hao Qiu home">
      <span class="brand-mark" aria-hidden="true">hq<span></span></span>
      <span>Hao Qiu <span class="chinese-name" lang="zh">邱昊</span></span>
    </a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="main-navigation" hidden>Menu <span aria-hidden="true">☰</span></button>
    <nav id="main-navigation" class="main-navigation" aria-label="Main navigation">
      <a href="{{ '/' | relative_url }}" {% if page.active_nav == 'home' %}aria-current="page"{% endif %}>About</a>
      <a href="{{ '/research/' | relative_url }}" {% if page.active_nav == 'research' %}aria-current="page"{% endif %}>Research</a>
      <a href="{{ '/publications/' | relative_url }}" {% if page.active_nav == 'publications' %}aria-current="page"{% endif %}>Publications</a>
      <a href="{{ '/cv/' | relative_url }}" {% if page.active_nav == 'cv' %}aria-current="page"{% endif %}>CV <span aria-hidden="true">↗</span></a>
    </nav>
  </header>
  <main id="main" tabindex="-1">{{ content }}</main>
  <footer class="site-footer content-wrap">
    <div><a class="footer-name" href="{{ '/' | relative_url }}">Hao (Harry) Qiu</a><p>Radio astronomy. A changing sky.</p></div>
    <div class="footer-links" aria-label="Academic and code profiles">
      <a href="{{ site.author.googlescholar }}">Google Scholar <span aria-hidden="true">↗</span></a>
      <a href="{{ site.author.orcid }}">ORCID <span aria-hidden="true">↗</span></a>
      <a href="https://github.com/{{ site.author.github }}">GitHub <span aria-hidden="true">↗</span></a>
    </div>
    <div class="footer-bottom"><span>© {{ 'now' | date: '%Y' }} Harry Qiu</span><span>Perth, Western Australia <span class="status-dot" aria-hidden="true"></span></span></div>
  </footer>
</body>
</html>
